<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Project Board</title>
    <link rel="stylesheet" href="css/kanban.css"/>
    <link rel="stylesheet" href="css/base.css"/>
</head>

<body>

    <div class="content">

        <div class="top-bar">
            <div class="back">←</div>
            <input
                class="project-title"
                type="text"
                value="My Project"
                maxlength="21"
                minlength="1"
                aria-label="Project title"
                spellcheck="false"
            >
            <button
                class="settings kanban-settings-button"
                type="button"
                aria-label="Kanban settings"
                aria-expanded="false"
                aria-controls="kanban-settings-panel"
            >⚙</button>
        </div>

        <div class="kanban-settings-panel" id="kanban-settings-panel" hidden>
            <label for="urgency-threshold">Urgency threshold</label>
            <div class="urgency-threshold-field">
                <input
                    id="urgency-threshold"
                    type="number"
                    min="0"
                    max="365"
                    step="1"
                    inputmode="numeric"
                >
                <span>days</span>
            </div>
            <p>Tasks due within this many days are marked urgent.</p>
        </div>

        <div class="lists-row">

            <template id="list-template">
                <div class="list">
                    <div class="list-header">
                        <input class="list-title" value="To Do" maxlength="9">
                        <span>•••</span>
                    </div>

                    <div class="list-cards"></div>

                    <button type="button" class="add-card">+ add card</button>
                </div>
            </template>

            <div class="list todo">
                <div class="list-header">
                    <input class="list-title" value="To Do" maxlength="9">
                    <span>•••</span>
                </div>

                <div class="list-cards"></div>

                <button type="button" class="add-card">+ add card</button>
            </div>

            <div class="list doing">
                <div class="list-header">
                    <input class="list-title" value="Doing" maxlength="9">
                    <span>•••</span>
                </div>

                <div class="list-cards"></div>
                <button type="button" class="add-card">+ add card</button>
            </div>

            <div class="list done">
                <div class="list-header">
                    <input class="list-title" value="Done" maxlength="9">
                    <span>•••</span>
                </div>

                <div class="list-cards"></div>

                <button type="button" class="add-card">+ add card</button>
            </div>

            <div class="add-list">
                + add list
            </div>

        </div>

    </div>

    <div id="trash">
        🗑️
    </div>

    <div id="alert">
        <p>Press ctrl+z to restore the last removed card or list</p>
    </div>

    <div id="card-editor-backdrop" hidden></div>

    <script src="js/kanban.js"></script>
</body>

</html>
