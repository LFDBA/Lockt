<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockt</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <div class="content home-page">
        <header class="home-header">
            <h1>lockt</h1>
        </header>

        <main>
            <section class="home-section recents" aria-labelledby="recents-title">
                <div class="section-heading">
                    <h2 id="recents-title">Recents</h2>
                </div>
                <div class="project-grid recent-boards"></div>
                <p class="empty-grid-message recents-empty" hidden>No matching recent projects</p>
            </section>

            <section class="home-section templates" aria-labelledby="templates-title">
                <div class="section-heading">
                    <h2 id="templates-title">Templates</h2>
                    <label class="project-search">
                        <span class="sr-only">Search templates and projects</span>
                        <input type="search" placeholder="Search" autocomplete="off">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="10.8" cy="10.8" r="5.8"></circle>
                            <path d="m15.2 15.2 4.2 4.2"></path>
                        </svg>
                    </label>
                </div>

                <div class="template-grid">
                    <button class="template-card" type="button" data-template="web-development" data-searchable-name="Web Development">
                        <span>Web Development</span>
                    </button>
                    <button class="template-card" type="button" data-template="personal" data-searchable-name="Personal">
                        <span>Personal</span>
                    </button>
                    <button class="template-card" type="button" data-template="management" data-searchable-name="Management">
                        <span>Management</span>
                    </button>
                    <button class="template-card" type="button" data-template="flexible" data-searchable-name="Flexible">
                        <span>Flexible</span>
                    </button>
                </div>
                <p class="empty-grid-message templates-empty" hidden>No matching templates</p>
            </section>

            <section class="home-section all-boards" aria-labelledby="all-projects-title">
                <div class="section-heading">
                    <h2 id="all-projects-title">All Projects</h2>
                </div>
                <div class="project-grid all-projects"></div>
                <p class="empty-grid-message projects-empty" hidden>No matching projects</p>
            </section>
        </main>
    </div>

    <div class="project-context-menu" role="menu" aria-label="Project actions" hidden>
        <button class="delete-project-menu-item" type="button" role="menuitem">
            Delete project
        </button>
    </div>

    <dialog class="delete-project-dialog" aria-labelledby="delete-project-title">
        <form class="delete-project-form">
            <h2 id="delete-project-title">Delete project?</h2>
            <p>
                This permanently deletes <strong class="delete-project-name"></strong>
                and all of its tasks.
            </p>
            <label for="delete-project-confirmation">
                Type the project name to confirm
            </label>
            <input
                id="delete-project-confirmation"
                class="delete-project-confirmation"
                type="text"
                autocomplete="off"
                spellcheck="false"
            >
            <p class="delete-project-hint">The name must match exactly.</p>
            <div class="delete-project-actions">
                <button class="cancel-project-deletion" type="button">Cancel</button>
                <button class="confirm-project-deletion" type="submit" disabled>
                    Delete project
                </button>
            </div>
        </form>
    </dialog>

    <script src="js/main.js"></script>
</body>
</html>
