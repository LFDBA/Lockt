<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt Chart</title>
    <link rel="stylesheet" href="css/gantt.css"/>
    <link rel="stylesheet" href="css/base.css"/>
    <link rel="stylesheet" href="css/kanban.css"/>
    <link rel="stylesheet" href="css/view-switcher.css"/>
</head>
<body>
    <div class="content gantt-page">
        <div class="top-bar">
            <div class="back">←</div>
            <input
                class="project-title"
                type="text"
                value="My Project"
                maxlength="21"
                minlength="1"
                aria-label="Project title"
                spellcheck="false"
            >
            <button
                class="settings kanban-settings-button"
                type="button"
                aria-label="Board settings"
                aria-expanded="false"
                aria-controls="kanban-settings-panel"
            >⚙</button>
        </div>

        <div class="kanban-settings-panel" id="kanban-settings-panel" hidden>
            <label class="kanban-setting-label" for="urgency-threshold">Urgency threshold</label>
            <div class="urgency-threshold-field">
                <input
                    id="urgency-threshold"
                    type="number"
                    min="0"
                    max="365"
                    step="1"
                    inputmode="numeric"
                >
                <span>days</span>
            </div>
            <p>Tasks due within this many days are marked urgent.</p>

            <div class="kanban-setting-section">
                <span class="kanban-setting-label">Board background</span>
                <div class="background-image-actions">
                    <label class="background-image-upload" for="board-background-image">
                        Upload image
                    </label>
                    <input
                        id="board-background-image"
                        class="background-image-input"
                        type="file"
                        accept="image/*"
                    >
                    <button class="remove-background-image" type="button" hidden>
                        Remove
                    </button>
                </div>
                <p class="background-image-status" aria-live="polite">
                    Also used as the cover unless a separate cover is chosen.
                </p>
            </div>

            <div class="kanban-setting-section kanban-danger-zone">
                <span class="kanban-setting-label">Danger zone</span>
                <button class="delete-board-button" type="button">
                    Delete project
                </button>
            </div>
        </div>

        <main class="gantt-chart" aria-label="Project Gantt chart">
            <div class="gantt-groups"></div>
        </main>
    </div>

    <dialog class="delete-board-dialog" aria-labelledby="delete-board-title">
        <form class="delete-board-form">
            <h2 id="delete-board-title">Delete project?</h2>
            <p>
                This permanently deletes <strong class="delete-board-name"></strong>
                and all of its tasks.
            </p>
            <label for="delete-board-confirmation">
                Type the project name to confirm
            </label>
            <input
                id="delete-board-confirmation"
                class="delete-board-confirmation"
                type="text"
                autocomplete="off"
                spellcheck="false"
            >
            <p class="delete-board-hint">The name must match exactly.</p>
            <div class="delete-board-actions">
                <button class="cancel-board-deletion" type="button">Cancel</button>
                <button class="confirm-board-deletion" type="submit" disabled>
                    Delete project
                </button>
            </div>
        </form>
    </dialog>

    <script src="js/gantt.js"></script>
    <script src="js/gantt-shell.js"></script>
    <script src="js/view-switcher.js"></script>
</body>
</html>
